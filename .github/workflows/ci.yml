name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

# Jobs opt in to exactly the scopes they need.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/sandros94/certmagic-scafo

jobs:
  test:
    name: vet & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  smoke:
    # Compiling the module inside xcaddy against a real Caddy tree is the only
    # check that catches interface drift in Caddy or certmagic.
    name: xcaddy build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build .

  publish:
    name: publish image
    runs-on: ubuntu-latest
    needs: [test, smoke]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The repository is private, so there are no hosted arm64 runners to
      # build on natively; arm64 is emulated instead.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            # Image tags carry the bare semver, without the git tag's "v".
            version="${RELEASE_TAG#v}"
            tags="${IMAGE}:${version}"
            # A prerelease must never move the "latest" pointer.
            if [ "$RELEASE_PRERELEASE" != "true" ]; then
              tags="${tags}"$'\n'"${IMAGE}:latest"
            fi
          else
            tags="${IMAGE}:edge"$'\n'"${IMAGE}:sha-${GITHUB_SHA:0:7}"
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "$tags"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
