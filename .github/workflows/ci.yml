name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

# Jobs opt in to exactly the scopes they need.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/sandros94/scafo-caddy

jobs:
  # Runners are pinned to the newest STABLE image pair rather than riding
  # ubuntu-latest: the amd64 and arm64 legs must move between OS versions
  # together, and -latest migrates only one of them. Bump both (and the
  # coordination jobs) to 26.04 once its runner images leave preview.
  test:
    name: vet & test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  smoke:
    # Compiling the module inside xcaddy against a real Caddy tree is the only
    # check that catches interface drift in Caddy or certmagic. Pull requests
    # do not publish, so a single native amd64 build is enough signal here; the
    # per-architecture builds happen on the publishing path below.
    name: xcaddy build
    runs-on: ubuntu-24.04
    needs: test
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build .

  build:
    # Each architecture is built on a runner of that architecture, so nothing is
    # emulated and the two builds run in parallel. Images are pushed by digest
    # only; the tags are attached later by the merge job, which is what keeps a
    # tag from ever pointing at a half-published image.
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # Artifact names cannot contain "/", so linux/amd64 becomes linux-amd64.
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # No inline provenance: BuildKit would embed it as an extra manifest
          # the registry UI lists as an "unknown/unknown" platform. Provenance
          # is attested once, over the merged manifest list, in the merge job.
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # The digest is carried as a file *name*, not as file content: the
          # merge job globs this directory to rebuild the source references.
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # Collects the per-architecture digests into one multi-platform manifest
    # list, puts the human-facing tags on it, and attests its provenance.
    name: publish manifest
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "release" ]; then
            # Image tags carry the bare semver, without the git tag's "v".
            version="${RELEASE_TAG#v}"
            tags="${IMAGE}:${version}"
            # A prerelease must never move the "latest" pointer.
            if [ "$RELEASE_PRERELEASE" != "true" ]; then
              tags="${tags}"$'\n'"${IMAGE}:latest"
            fi
          else
            tags="${IMAGE}:edge"$'\n'"${IMAGE}:sha-${GITHUB_SHA:0:7}"
          fi
          {
            echo "tags<<TAGS_EOF"
            echo "$tags"
            echo "TAGS_EOF"
            # One tag is enough to inspect the published manifest afterwards.
            echo "primary=$(echo "$tags" | head -n 1)"
          } >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            tag_args+=(-t "$tag")
          done <<< "$TAGS"
          # Each file in this directory is named after one per-architecture
          # digest, so the glob enumerates the manifest sources.
          sources=()
          for digest in *; do
            sources+=("${IMAGE}@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Inspect image
        id: inspect
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${{ steps.meta.outputs.primary }}"
          digest="$(docker buildx imagetools inspect "${{ steps.meta.outputs.primary }}" \
            --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Provenance lives in GitHub's attestation store (Sigstore-backed) rather
      # than inside the manifest list, and covers the multi-platform list the
      # tags point at. Verify with:
      #   gh attestation verify oci://ghcr.io/sandros94/scafo-caddy:edge -R sandros94/scafo-certmagic
      #
      # The store refuses user-owned PRIVATE repositories ("make this repository
      # public"), so the step arms itself on visibility rather than failing on
      # every run until then.
      - name: Attest provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
