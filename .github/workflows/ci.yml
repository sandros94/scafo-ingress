name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

# Jobs opt in to exactly the scopes they need.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/sandros94/scafo-caddy

jobs:
  # Runners are pinned to the newest STABLE image pair rather than riding
  # ubuntu-latest: the amd64 and arm64 legs must move between OS versions
  # together, and -latest migrates only one of them. Bump both (and the
  # coordination jobs, here and in publish.yml) to 26.04 once its runner images
  # leave preview.
  test:
    name: vet & test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: check caddy pins
        run: .github/scripts/check-pins.sh

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  smoke:
    # Compiling the modules inside xcaddy against a real Caddy tree is the only
    # check that catches interface drift in Caddy or certmagic. Pull requests
    # do not publish, so a single native amd64 build is enough signal here; the
    # per-architecture builds happen on the publishing path below.
    name: xcaddy build
    runs-on: ubuntu-24.04
    needs: test
    # success() is spelled out throughout this file because a custom if
    # replaces the implicit one that a "needs" would otherwise carry.
    if: success() && github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build .

  tags:
    # What this run has earned the right to tag. Kept out of publish.yml so the
    # reusable workflow stays a publisher and not a policy: the tracker decides
    # its own tags the same way, through the same script.
    name: compute tags
    runs-on: ubuntu-24.04
    needs: test
    if: success() && github.event_name != 'pull_request'
    permissions:
      contents: read
    outputs:
      image-tags: ${{ steps.compute.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tags
        id: compute
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          args=(--image "$IMAGE")
          if [ "$EVENT_NAME" = "release" ]; then
            args+=(--version "$RELEASE_TAG")
            # A prerelease must never move the "latest" pointer.
            if [ "$RELEASE_PRERELEASE" != "true" ]; then
              args+=(--latest)
            fi
          else
            args+=(--sha "$GITHUB_SHA")
          fi
          {
            echo "tags<<TAGS_EOF"
            .github/scripts/image-tags.sh "${args[@]}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

  publish:
    # One call covers both publishing events. On a push there is no release, so
    # release-tag arrives empty -- github.event.release is null outside a
    # release event -- and publish.yml skips the binary jobs.
    #
    # The permissions here are the union of what publish.yml's jobs ask for,
    # not the minimum this event needs, because a called workflow may only
    # narrow the caller's grant: asking for more than the caller holds is a
    # hard error, even from a job that would have been skipped. Nothing is over-
    # privileged as a result -- this job runs no steps of its own, and each job
    # inside publish.yml declares the narrower set it actually uses.
    name: publish
    needs: tags
    if: success() && github.event_name != 'pull_request'
    permissions:
      # contents: write attaches binaries to the release being published.
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ github.sha }}
      image-tags: ${{ needs.tags.outputs.image-tags }}
      release-tag: ${{ github.event.release.tag_name }}
